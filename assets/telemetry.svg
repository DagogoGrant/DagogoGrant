<svg width="1000" height="360" viewBox="0 0 1000 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Grant Dagogo technical profile</title>
  <desc id="desc">A dark professional engineering profile card focused on AI systems fundamentals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="358" rx="17" stroke="#1F2937" stroke-width="2"/>

  <text x="56" y="58" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Technical Profile</text>
  <text x="56" y="88" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="15">AI systems engineering with emphasis on fundamentals, reliability, and production behavior.</text>
  <path d="M56 116H944" stroke="#334155" stroke-width="1"/>

  <g>
    <rect x="56" y="148" width="264" height="118" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="80" y="184" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">CORE</text>
    <text x="80" y="216" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">ML + LLM Systems</text>
    <text x="80" y="244" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="14">models, data, retrieval, agents</text>
  </g>

  <g>
    <rect x="368" y="148" width="264" height="118" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="392" y="184" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">METHOD</text>
    <text x="392" y="216" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Evaluate + Debug</text>
    <text x="392" y="244" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="14">metrics, traces, failure modes</text>
  </g>

  <g>
    <rect x="680" y="148" width="264" height="118" rx="12" fill="#0F172A" stroke="#334155"/>
    <text x="704" y="184" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="700">DELIVERY</text>
    <text x="704" y="216" fill="#F8FAFC" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Production AI</text>
    <text x="704" y="244" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="14">APIs, automation, monitoring</text>
  </g>

  <text x="56" y="318" fill="#64748B" font-family="JetBrains Mono, Consolas, monospace" font-size="14">focus: classification | regression | clustering | retrieval | evaluation | production debugging</text>
</svg>
